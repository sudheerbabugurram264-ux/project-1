<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard | NRIIT</title>
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d47a1;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
text-decoration:none;
background:#ff9800;
color:white;
padding:10px 20px;
border-radius:5px;
}

.container{
width:95%;
max-width:1300px;
margin:30px auto;
}

h1{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:35px;

}

.card{

background:white;
padding:25px;
text-align:center;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.card h2{
color:#1565c0;
font-size:35px;
}

.card p{
margin-top:10px;
font-size:18px;
}

.menu{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;

}

.box{

background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.box h3{

margin-bottom:20px;
color:#0d47a1;

}

button{

width:100%;
padding:12px;
margin:8px 0;
border:none;
background:#1565c0;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;

}

button:hover{

background:#0d47a1;

}

.logout{

background:#d32f2f;

}

.logout:hover{

background:#b71c1c;

}

footer{

text-align:center;
margin-top:40px;
padding:20px;
color:gray;

}

</style>

</head>

<body>

<header>

<h2>👨‍💼 Admin Dashboard</h2>

<a href="login.html">Logout</a>

</header>

<div class="container">

<h1>College Management System</h1>

<div class="cards">

<div class="card">

<h2>120</h2>

<p>Total Students</p>

</div>

<div class="card">

<h2>18</h2>

<p>Faculty Members</p>

</div>

<div class="card">

<h2>95%</h2>

<p>Attendance</p>

</div>

<div class="card">

<h2>14</h2>

<p>Placement Drives</p>

</div>

</div>

<div class="menu">

<div class="box">

<h3>🎓 Student Management</h3>

<button onclick="msg('Add Student')">Add Student</button>

<button onclick="msg('Update Student')">Update Student</button>

<button onclick="msg('Delete Student')">Delete Student</button>

<button onclick="window.location='students.html'">View Students</button>

</div>

<div class="box">

<h3>📊 Attendance</h3>

<button onclick="msg('Take Attendance')">Take Attendance</button>

<button onclick="msg('Update Attendance')">Update Attendance</button>

<button onclick="window.location='attendance.html'">View Attendance</button>

</div>

<div class="box">

<h3>📝 Marks & Results</h3>

<button onclick="msg('Update Marks')">Update Marks</button>

<button onclick="msg('Publish Results')">Publish Results</button>

<button onclick="window.location='results.html'">View Results</button>

</div>

<div class="box">

<h3>📢 Notices</h3>

<button onclick="msg('Add Notice')">Add Notice</button>

<button onclick="msg('Edit Notice')">Edit Notice</button>

<button onclick="window.location='notices.html'">View Notices</button>

</div>

<div class="box">

<h3>💼 Placements</h3>

<button onclick="msg('Add Company')">Add Company</button>

<button onclick="msg('Update Placement')">Update Placement</button>

<button onclick="window.location='placements.html'">View Placements</button>

</div>

<div class="box">

<h3>👨‍🏫 Faculty</h3>

<button onclick="msg('Add Faculty')">Add Faculty</button>

<button onclick="msg('Update Faculty')">Update Faculty</button>

<button onclick="window.location='faculty.html'">Faculty List</button>

</div>

<div class="box">

<h3>⚙️ Settings</h3>

<button onclick="window.location='settings.html'">Settings</button>

<button class="logout" onclick="logout()">Logout</button>

</div>

</div>

</div>

<footer>

© 2026 NRI Institute of Technology | AI & ML Department

</footer>

<script>

function msg(action){

alert(action + " feature will be available in the database version.");

}

function logout(){

if(confirm("Do you want to logout?")){

window.location="login.html";

}

}

</script>
<script type="module" src="firebase.js"></script>
</body>
</html>

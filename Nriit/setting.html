
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Settings | NRIIT AI & ML</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d47a1;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header h2{
font-size:24px;
}

header a{
text-decoration:none;
background:#ff9800;
color:white;
padding:10px 18px;
border-radius:6px;
}

.container{
width:90%;
max-width:700px;
margin:35px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.container h1{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.profile{
text-align:center;
margin-bottom:30px;
}

.profile img{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #1565c0;
object-fit:cover;
}

.profile input{
margin-top:15px;
}

.form-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

button{
width:100%;
padding:13px;
margin-top:15px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

.logout{
background:#d32f2f;
}

.logout:hover{
background:#b71c1c;
}

.darkmode{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px;
padding:15px;
background:#f0f0f0;
border-radius:8px;
}

footer{
text-align:center;
margin-top:30px;
color:gray;
}

.dark{
background:#222;
color:white;
}

.dark .container{
background:#333;
color:white;
}

.dark input{
background:#444;
color:white;
border:1px solid #666;
}

</style>

</head>

<body>

<header>

<h2>⚙️ Settings</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<h1>Student Settings</h1>

<div class="profile">

<img id="preview" src="https://via.placeholder.com/120" alt="Profile">

<br>

<input type="file" id="photo" accept="image/*">

</div>

<div class="form-group">

<label>Student Name</label>

<input type="text" value="Sudheer Babu">

</div>

<div class="form-group">

<label>Roll Number</label>

<input type="text" value="24KP1A6136" readonly>

</div>

<div class="form-group">

<label>Email</label>

<input type="email" value="student@nriit.edu.in">

</div>

<div class="form-group">

<label>Mobile Number</label>

<input type="tel" value="9876543210">

</div>

<div class="form-group">

<label>Change Password</label>

<input type="password" placeholder="Enter New Password">

</div>

<button onclick="saveSettings()">

💾 Save Changes

</button>

<div class="darkmode">

<label>🌙 Dark Mode</label>

<input type="checkbox" onclick="toggleDarkMode()">

</div>

<button class="logout" onclick="logout()">

🚪 Logout

</button>

</div>

<footer>

© 2026 NRI Institute of Technology | AI & ML Department

</footer>

<script>

document.getElementById("photo").addEventListener("change",function(){

const file=this.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

}

reader.readAsDataURL(file);

}

});

function saveSettings(){

alert("Settings Saved Successfully!");

}

function logout(){

if(confirm("Are you sure you want to logout?")){

window.location.href="login.html";

}

}

function toggleDarkMode(){

document.body.classList.toggle("dark");

}

</script>
<script type="module" src="firebase.js"></script>
</body>
</html>

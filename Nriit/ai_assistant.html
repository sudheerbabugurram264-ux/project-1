<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Assistant | NRIIT AI & ML</title>
<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d47a1;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
text-decoration:none;
background:#ff9800;
color:white;
padding:10px 18px;
border-radius:6px;
}

.container{
width:90%;
max-width:900px;
margin:30px auto;
background:white;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
overflow:hidden;
}

.chat-header{
background:#1565c0;
color:white;
padding:20px;
text-align:center;
font-size:24px;
}

.chat-box{
height:450px;
overflow-y:auto;
padding:20px;
background:#eef4ff;
}

.message{
margin:10px 0;
padding:12px;
border-radius:8px;
max-width:80%;
}

.user{
background:#1565c0;
color:white;
margin-left:auto;
}

.bot{
background:white;
border:1px solid #ddd;
}

.input-area{
display:flex;
padding:15px;
background:white;
}

.input-area input{
flex:1;
padding:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
}

.input-area button{
margin-left:10px;
padding:12px 20px;
background:#1565c0;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.input-area button:hover{
background:#0d47a1;
}

footer{
text-align:center;
padding:20px;
color:gray;
}

</style>

</head>

<body>

<header>

<h2>🤖 AI Assistant</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<div class="chat-header">

NRIIT AI Study Assistant

</div>

<div class="chat-box" id="chatBox">

<div class="message bot">

👋 Hello Student!<br><br>

I can help you with:

<br><br>

📚 Notes<br>
📝 Results<br>
📅 Timetable<br>
📊 Attendance<br>
💼 Placements<br>
👨‍🏫 Faculty Details<br>
📢 Notices<br>

Type your question below.

</div>

</div>

<div class="input-area">

<input
type="text"
id="question"
placeholder="Ask your question...">

<button onclick="askAI()">

Send

</button>

</div>

</div>

<footer>

© 2026 NRI Institute of Technology | AI & ML Department

</footer>

<script>

function askAI(){

let input=document.getElementById("question");

let text=input.value.trim();

if(text=="") return;

let chat=document.getElementById("chatBox");

chat.innerHTML+=`
<div class="message user">
${text}
</div>
`;

let reply="Sorry, I don't understand your question.";

let q=text.toLowerCase();

if(q.includes("attendance")){

reply="📊 Your attendance page is available in the dashboard.";

}

else if(q.includes("result")){

reply="📝 Open Results page to view your SGPA, CGPA and semester result.";

}

else if(q.includes("marks")){

reply="📚 Open Marks page to view subject-wise grades.";

}

else if(q.includes("notes")){

reply="📖 Notes are available in the Notes section for every subject.";

}

else if(q.includes("placement")){

reply="💼 Visit the Placement page to see current campus drives.";

}

else if(q.includes("faculty")){

reply="👨‍🏫 Faculty details are available in the Faculty section.";

}

else if(q.includes("timetable")){

reply="📅 Check the Timetable page for today's classes.";

}

else if(q.includes("contact")){

reply="📞 College contact details are available in the Contact page.";

}

else if(q.includes("hello") || q.includes("hi")){

reply="👋 Hello! How can I help you today?";

}

chat.innerHTML+=`
<div class="message bot">
${reply}
</div>
`;

chat.scrollTop=chat.scrollHeight;

input.value="";

}

</script>
<script type="module" src="firebase.js"></script>
</body>

</html>

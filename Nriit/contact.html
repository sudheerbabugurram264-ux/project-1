<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>Contact Us | NRIIT AI & ML</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f4f6f9;
}

header{
background:#0d47a1;
color:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

header a{
text-decoration:none;
background:#ff9800;
color:white;
padding:10px 18px;
border-radius:6px;
}

.container{
width:90%;
max-width:1100px;
margin:40px auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
}

.card{
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.card h2{
color:#0d47a1;
margin-bottom:20px;
}

.info{
margin-bottom:20px;
font-size:17px;
}

.info strong{
color:#1565c0;
}

.form-group{
margin-bottom:18px;
}

.form-group label{
display:block;
margin-bottom:8px;
font-weight:600;
}

.form-group input,
.form-group textarea{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
font-size:15px;
}

textarea{
height:120px;
resize:none;
}

button{
width:100%;
padding:13px;
background:#1565c0;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#0d47a1;
}

iframe{
width:100%;
height:300px;
border:none;
border-radius:10px;
margin-top:20px;
}

footer{
text-align:center;
padding:20px;
color:gray;
margin-top:20px;
}

@media(max-width:768px){

.container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<h2>📞 Contact Us</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<div class="card">

<h2>College Information</h2>

<div class="info">
<strong>🏫 College:</strong><br>
NRI Institute of Technology
</div>

<div class="info">
<strong>📍 Address:</strong><br>
Agiripalli, Vijayawada,<br>
Andhra Pradesh - 521212
</div>

<div class="info">
<strong>📞 Phone:</strong><br>
+91 866-XXXXXXX
</div>

<div class="info">
<strong>📧 Email:</strong><br>
info@nriit.edu.in
</div>

<div class="info">
<strong>🌐 Website:</strong><br>
www.nriit.edu.in
</div>

<iframe
src="https://maps.google.com/maps?q=NRI%20Institute%20of%20Technology%20Agiripalli&t=&z=15&ie=UTF8&iwloc=&output=embed">
</iframe>

</div>

<div class="card">

<h2>Send Message</h2>

<form onsubmit="return sendMessage()">

<div class="form-group">

<label>Student Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required>

</div>

<div class="form-group">

<label>Roll Number</label>

<input
type="text"
id="roll"
placeholder="Enter Roll Number"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="form-group">

<label>Message</label>

<textarea
id="message"
placeholder="Type your message..."
required></textarea>

</div>

<button type="submit">

Send Message

</button>

</form>

</div>

</div>

<footer>

© 2026 NRI Institute of Technology | AI & ML Department

</footer>

<script>

function sendMessage(){

alert("✅ Your message has been sent successfully!");

document.querySelector("form").reset();

return false;

}

</script>
<script type="module" src="firebase.js"></script>
</body>
</html>
